#@TYPE: Machine
#@NAME: UniPi Neuron
#@DESCRIPTION: Machine configuration for UniPi Neuron boards based on Raspberry Pi 4

MACHINEOVERRIDES =. "raspberrypi4-64:"
include conf/machine/raspberrypi4-64.conf

# unipi-os-configurator deliberately not installed here - see the comment
# on unipi-os-configurator-data-neuron's RDEPENDS. Not currently load-bearing
# and its python3 dependency doesn't fit the HUP size budget on this
# existing device type.
MACHINE_EXTRA_RDEPENDS += " \
    unipi-kernel-modules \
    unipi-tools \
    unipi-os-configurator-data-neuron \
"

# The do_resin_boot_dirgen_and_deploy[depends] addition for
# unipi-os-configurator-data-neuron:do_deploy lives in
# recipes-core/images/balena-image.inc (MACHINE-conditional, alongside the
# other per-machine depends already there) rather than here - a
# machine.conf isn't the recipe-metadata layer this dependency belongs in.
