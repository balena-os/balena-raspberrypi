#@TYPE: Machine
#@NAME: UniPi Neuron
#@DESCRIPTION: Machine configuration for UniPi Neuron boards based on Raspberry Pi 4

MACHINEOVERRIDES =. "raspberrypi4-64:"
include conf/machine/raspberrypi4-64.conf

# The UniPi packages (unipi-kernel-modules, unipi-tools,
# unipi-os-configurator-data-neuron) and the do_resin_boot_dirgen_and_deploy
# dependency on unipi-os-configurator-data-neuron:do_deploy are both set in
# recipes-core/images/balena-image.inc, MACHINE-conditional, alongside the
# other per-machine image settings there. They deliberately are NOT here as
# MACHINE_EXTRA_RDEPENDS: that variable is only consumed by
# packagegroup-machine-base (via packagegroup-base), which balena-image never
# installs, so setting it here silently installed nothing - confirmed on real
# hardware (no unipi modules, no /dev/ttyNS*).
#
# unipi-os-configurator is deliberately not installed - see the comment on
# unipi-os-configurator-data-neuron's RDEPENDS. Not currently load-bearing and
# its python3 dependency doesn't fit the HUP size budget on this existing
# device type.
