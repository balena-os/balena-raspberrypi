#@TYPE: Machine
#@NAME: CompuLab RaspberryPi 5 Board (64bit)
#@DESCRIPTION: Machine configuration for the RaspberryPi 5 in 64 bits mode

require conf/machine/include/arm/armv8-2a/tune-cortexa76.inc
include conf/machine/include/rpi-base.inc

# Reuse the Raspberry Pi 5 bootloader, image, and kernel configuration. The
# machine name itself is already present in OVERRIDES.
MACHINEOVERRIDES =. "raspberrypi5:"

# The board support patches in this layer target the 6.12 kernel supplied by
# meta-balena-raspberrypi.
PREFERRED_VERSION_linux-raspberrypi = "6.12%"

MACHINE_FEATURES += "pci"
MACHINE_EXTRA_RRECOMMENDS += "\
    linux-firmware-rpidistro-bcm43455 \
    bluez-firmware-rpidistro-bcm4345c0-hcd \
    linux-firmware-rpidistro-bcm43456 \
    bluez-firmware-rpidistro-bcm4345c5-hcd \
"

RPI_KERNEL_DEVICETREE = " \
    compulab/iotg-rpi5.dtb \
    compulab/iotg-rpi5l.dtb \
"

RPI_KERNEL_DEVICETREE_OVERLAYS = " \
    overlays/iotg-rpi5/iotg-rpi5-gmc.dtbo \
    overlays/iotg-rpi5/iotg-rpi5-io-a.dtbo \
    overlays/iotg-rpi5/iotg-rpi5-io-b.dtbo \
    overlays/iotg-rpi5/iotg-rpi5-b2b.dtbo \
    overlays/iotg-rpi5/iotg-rpi5-cmd-button.dtbo \
    overlays/iotg-rpi5/iotg-rpi5-dio.dtbo \
    overlays/iotg-rpi5/iotg-rpi5-modem-reset.dtbo \
"

SERIAL_CONSOLES = "115200;ttyAMA0"

VC4DTBO ?= "vc4-kms-v3d"

# When u-boot is enabled we need to use the "Image" format and the "booti"
# command to load the kernel
KERNEL_IMAGETYPE_UBOOT ?= "Image"
# "zImage" not supported on arm64 and ".gz" images not supported by bootloader yet
KERNEL_IMAGETYPE_DIRECT ?= "Image"
KERNEL_BOOTCMD ?= "booti"
