# yaml-language-server: $schema=https://raw.githubusercontent.com/balena-os/balena-yocto-scripts/refs/heads/master/schemas/hostapp-composition.json
version: '2.4'
# Every service must set network_mode, or compose-go injects a `default` network into the
# published composition and the supervisor creates a real bridge for it, whose auto-assigned
# subnet can collide with the device's LAN. Declaring `networks: {}` does not suppress it.
services:

  ebpf:
    image: __BUILD_OUTPUT__
    network_mode: none
    runtime: extension
    labels:
      io.balena.image.class: 'overlay'
      io.balena.image.store: 'data'
      # Mount this extension LEFT of the hostapp in mobynit's overlay stack,
      # 100 leaves headroom both directions for future overlays that need
      # to shadow or be shadowed by the extension kernel.
      io.balena.image.override: '100'
      io.balena.update.requires-reboot: '1'
    profiles:
      - ebpf
    x-build:
      recipe: balena-ebpf-extension

  tracing:
    image: __BUILD_OUTPUT__
    network_mode: none
    runtime: extension
    labels:
      io.balena.image.class: 'overlay'
      io.balena.image.store: 'data'
      io.balena.update.requires-reboot: '1'
    profiles:
      - tracing
    x-build:
      recipe: balena-tracing-extension
